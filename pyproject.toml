[project]
name = "legal-workflow-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.11",
    "sentence-transformers>=3.0.0",
    "pgvector>=0.3.0",
    "rank-bm25>=0.2.2",
    "pdfplumber>=0.11.9",
    "fpdf>=1.7.2",
    "python-dotenv>=1.2.2",
    "groq>=1.1.2",
    "google-genai>=1.30.0",
    "google-generativeai>=0.8.6",
    "langgraph>=1.2.9",
    "scikit-learn>=1.5.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The project uses a flat layout and is not pip-installed, so put the repo root
# on sys.path for imports of `legal_workflow_generator`.
pythonpath = ["."]
# Skip the slow, external-dependency tests (live Postgres + Gemini) unless the
# suite is invoked with `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: needs a live Postgres database and/or Gemini API key (deselected by default)",
]

[tool.coverage.run]
source = ["legal_workflow_generator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
